[common]
version = 2
import_std = [
    "fs",
    "net",
    "process",
    "unix_sockets",
]

[sandbox]
kind = "Disabled"

[api.process]
exclude = [
    "std::process::ExitCode",
    "std::process::ExitStatus",
]

[api.fs]
exclude = [
    "std::path",
]

[pkg.path_ratchet]
allow_unsafe = true

[pkg.serde_derive]
allow_proc_macro = true

[pkg.serde]
build.allow_apis = [
    "fs",
    "process",
]

[pkg.serde_core]
build.allow_apis = [
    "fs",
    "process",
]
allow_unsafe = true
